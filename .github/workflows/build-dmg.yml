name: Build and publish desktop installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 2.12.0"
        required: true
        default: "2.12.0"
      publish:
        description: "Publish or update the GitHub release"
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  metadata:
    runs-on: macos-15
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - id: release
        name: Resolve release metadata
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_VERSION="${GITHUB_REF_NAME}"
          else
            RAW_VERSION="${{ inputs.version }}"
          fi
          VERSION="${RAW_VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: ${VERSION}" >&2
            exit 2
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

  quality:
    needs: metadata
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --quiet -r requirements-core.txt pytest
      - name: Static checks
        run: |
          bash -n build_dmg.sh
          .ci-venv/bin/python -m py_compile \
            main.py dashboard.py product_navigation.py launcher.py \
            audio_playback.py session_export.py session_history_player.py \
            session_recording.py ui_components.py mac_translation.py \
            model_catalog.py model_manager.py translation_engine.py \
            translation_model_manager.py public_model_download.py sparkle_updater.py \
            recognition_quality.py accuracy_transcriber.py \
            platform_support.py windows_integration.py windows_system_audio.py \
            adaptive_vad.py runtime_performance.py \
            src/live_translation_drafts.py src/runtime_metrics.py \
            src/semantic_endpoint.py src/streaming_transcript_state.py \
            transcriber_pool.py src/accuracy_refinement.py \
            src/contextual_phrase_composer.py
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: .ci-venv/bin/python -m pytest -q

  build:
    needs: [metadata, quality]
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Show build host
        run: |
          sw_vers
          uname -m
      - name: Prepare Apple signing credentials
        env:
          APPLE_DEVELOPER_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          if [[ -n "${APPLE_DEVELOPER_CERTIFICATE_BASE64}" && -n "${APPLE_SIGNING_IDENTITY}" ]]; then
            KEYCHAIN="${RUNNER_TEMP}/realtime-subtitle-signing.keychain-db"
            KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
            security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
            security set-keychain-settings -lut 21600 "${KEYCHAIN}"
            security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
            printf '%s' "${APPLE_DEVELOPER_CERTIFICATE_BASE64}" | /usr/bin/base64 -D > "${RUNNER_TEMP}/developer-id.p12"
            security import "${RUNNER_TEMP}/developer-id.p12" -k "${KEYCHAIN}" \
              -P "${APPLE_DEVELOPER_CERTIFICATE_PASSWORD}" -A -T /usr/bin/codesign
            security list-keychains -d user -s "${KEYCHAIN}"
            security set-key-partition-list -S apple-tool:,apple: -s \
              -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
            echo "MACOS_SIGN_IDENTITY=${APPLE_SIGNING_IDENTITY}" >> "${GITHUB_ENV}"
            if [[ -n "${APPLE_NOTARY_KEY_BASE64}" && -n "${APPLE_NOTARY_KEY_ID}" && -n "${APPLE_NOTARY_ISSUER_ID}" ]]; then
              printf '%s' "${APPLE_NOTARY_KEY_BASE64}" | /usr/bin/base64 -D > "${RUNNER_TEMP}/AuthKey.p8"
              xcrun notarytool store-credentials realtime-subtitle-notary \
                --key "${RUNNER_TEMP}/AuthKey.p8" \
                --key-id "${APPLE_NOTARY_KEY_ID}" \
                --issuer "${APPLE_NOTARY_ISSUER_ID}" \
                --keychain "${KEYCHAIN}"
              echo "MACOS_NOTARY_PROFILE=realtime-subtitle-notary" >> "${GITHUB_ENV}"
              echo "MACOS_NOTARY_KEYCHAIN=${KEYCHAIN}" >> "${GITHUB_ENV}"
            fi
          else
            echo "Developer ID secrets are absent; producing an ad-hoc signed build with Sparkle EdDSA update verification."
          fi
      - name: Build and verify DMG
        run: bash build_dmg.sh "${{ needs.metadata.outputs.version }}" "${{ matrix.arch }}"
      - name: Verify first launch preserves bundle signature
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          APP="build/${{ matrix.arch }}/RealtimeSubtitle.app"
          "${APP}/Contents/MacOS/realtime-subtitle" --startup-smoke
          codesign --verify --deep --strict --verbose=2 "${APP}"
      - name: Verify target identity
        shell: bash
        run: |
          APP="build/${{ matrix.arch }}/RealtimeSubtitle.app"
          DMG="dist/RealtimeSubtitle-${{ needs.metadata.outputs.version }}-macos-${{ matrix.arch }}.dmg"
          test -d "${APP}"
          test -f "${DMG}"
          test "$(plutil -extract CFBundleIconFile raw "${APP}/Contents/Info.plist")" = "AppIcon"
          grep -q "BUILD_ARCH = \"${{ matrix.arch }}\"" "${APP}/Contents/Resources/version.py"
          file "${APP}/Contents/Resources/python/bin/python3"
          HELPER="${APP}/Contents/Resources/bin/system-audio-capture"
          test -x "${HELPER}"
          file "${HELPER}" | grep -q "${{ matrix.arch }}"
          TRANSLATION_HELPER="${APP}/Contents/Resources/bin/mac-translation"
          test -x "${TRANSLATION_HELPER}"
          file "${TRANSLATION_HELPER}" | grep -q "${{ matrix.arch }}"
          UPDATE_RELAUNCH_HELPER="${APP}/Contents/Resources/bin/update-relaunch-helper"
          test -x "${UPDATE_RELAUNCH_HELPER}"
          file "${UPDATE_RELAUNCH_HELPER}" | grep -q "${{ matrix.arch }}"
          shasum -a 256 "${DMG}"
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealtimeSubtitle-${{ matrix.arch }}
          path: dist/RealtimeSubtitle-${{ needs.metadata.outputs.version }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 30

  build-windows:
    needs: [metadata, quality]
    name: Build Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Windows regression suite
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --disable-pip-version-check --quiet -r requirements-core.txt pytest
          python -m pytest -q
          python main.py --startup-smoke
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build and verify Windows installer
        shell: powershell
        run: .\build_windows.ps1 -Version "${{ needs.metadata.outputs.version }}"
      - name: Verify target identity
        shell: powershell
        run: |
          $Installer = "dist\RealtimeSubtitle-${{ needs.metadata.outputs.version }}-windows-x64-setup.exe"
          if (-not (Test-Path $Installer)) { throw "Missing Windows installer" }
          if ((Get-Item $Installer).Length -lt 100MB) { throw "Windows installer is unexpectedly small" }
          if (-not (Select-String -Path "build\windows-x64\app\version.py" -Pattern 'BUILD_PLATFORM = "windows"' -Quiet)) { throw "Wrong build platform" }
          if (-not (Select-String -Path "build\windows-x64\app\version.py" -Pattern 'BUILD_ARCH = "x86_64"' -Quiet)) { throw "Wrong build architecture" }
          Get-FileHash $Installer -Algorithm SHA256
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealtimeSubtitle-windows-x64
          path: dist/RealtimeSubtitle-${{ needs.metadata.outputs.version }}-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [metadata, build, build-windows]
    if: ${{ github.event_name == 'push' || inputs.publish == true }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: RealtimeSubtitle-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release-assets
          shasum -a 256 *.dmg *.exe > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt
      - name: Create release notes and signed Sparkle appcasts
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "${SPARKLE_ED25519_PRIVATE_KEY}" ]]; then
            echo "SPARKLE_ED25519_PRIVATE_KEY is required for a publishable update feed." >&2
            exit 1
          fi
          SPARKLE_VERSION="2.9.6"
          SPARKLE_SHA256="52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192"
          curl -L --fail --retry 3 -o "${RUNNER_TEMP}/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_SHA256}  ${RUNNER_TEMP}/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "${RUNNER_TEMP}/sparkle"
          tar xf "${RUNNER_TEMP}/sparkle.tar.xz" -C "${RUNNER_TEMP}/sparkle"

          NOTES="release-notes-v${VERSION}.html"
          cat > "release-assets/${NOTES}" <<EOF
          <!doctype html><html lang="en"><meta charset="utf-8"><body>
          <h2>Realtime Subtitle ${VERSION}</h2>
          <ul>
            <li>Public built-in models now always download anonymously; stale Hugging Face tokens are ignored and retried.</li>
            <li>Model access failures now explain the cause and offer a direct recovery action instead of exposing a raw HTTP 401.</li>
            <li>Saved-session lists and transcript lines reflow at every window size without oversized text or horizontal scrolling.</li>
            <li>Sparkle 2 adds signed in-app update checks, automatic installation, version prompts, and release notes on macOS.</li>
            <li>Portable-Python macOS builds now complete the verified replacement with a tested, quiet application relaunch.</li>
          </ul>
          <p>Audio, settings, models, and transcripts remain local unless you explicitly choose an online translation provider.</p>
          </body></html>
          EOF

          PUB_DATE="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          BASE_URL="https://github.com/Dreaminmaster/realtime-subtitle-product/releases/download/v${VERSION}"
          for ARCH in arm64 x86_64; do
            DMG="release-assets/RealtimeSubtitle-${VERSION}-macos-${ARCH}.dmg"
            test -f "${DMG}"
            SIGN_OUTPUT="$(printf '%s\n' "${SPARKLE_ED25519_PRIVATE_KEY}" | \
              "${RUNNER_TEMP}/sparkle/bin/sign_update" --ed-key-file - "${DMG}")"
            SIGNATURE="$(printf '%s' "${SIGN_OUTPUT}" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
            test -n "${SIGNATURE}"
            LENGTH="$(stat -f%z "${DMG}")"
            python3 tools/generate_sparkle_appcast.py \
              --version "${VERSION}" \
              --architecture "${ARCH}" \
              --download-url "${BASE_URL}/$(basename "${DMG}")" \
              --release-notes-url "${BASE_URL}/${NOTES}" \
              --signature "${SIGNATURE}" \
              --length "${LENGTH}" \
              --pub-date "${PUB_DATE}" \
              --output "release-assets/appcast-${ARCH}.xml"
          done
          # Human-facing conventional filename; packaged apps use the precise
          # architecture feed so two packages with one version never compete.
          cp release-assets/appcast-arm64.xml release-assets/appcast.xml
          xmllint --noout release-assets/appcast*.xml
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          TITLE="Realtime Subtitle ${TAG}"
          cat > release-notes.md <<EOF
          Realtime Subtitle ${VERSION} improves model recovery, responsive history, and macOS delivery.

          - Public built-in models always download anonymously. A stale Hugging Face token is ignored automatically and retried once.
          - Persistent access failures show an understandable reason and a model-page recovery action instead of a raw HTTP 401.
          - History sessions and transcript lines reflow without oversized text or horizontal scrolling.
          - macOS packages embed Sparkle 2 for signed update checks, automatic download and installation, version prompts, and release notes.
          - The ad-hoc-signed macOS path was tested end to end: EdDSA verification, in-place replacement, clean shutdown, and automatic relaunch.
          - Sparkle EdDSA verifies every update enclosure. Apple Developer ID signing and notarization are added to this same flow when those credentials become available.

          Downloads:

          - \`arm64\`: Apple Silicon Macs
          - \`x86_64\`: Intel Macs
          - \`windows-x64-setup.exe\`: Windows 10/11 x64 installer

          Verify the matching entry in \`SHA256SUMS.txt\` before installation.
          EOF
          PRERELEASE_ARG=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            PRERELEASE_ARG=(--prerelease)
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TITLE}" --notes-file release-notes.md "${PRERELEASE_ARG[@]}"
            gh release upload "${TAG}" release-assets/* --clobber
          else
            gh release create "${TAG}" release-assets/* --title "${TITLE}" --notes-file release-notes.md "${PRERELEASE_ARG[@]}"
          fi
