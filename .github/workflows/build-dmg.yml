name: Build DMG
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          sw_vers
          python3 --version
          pwd
          ls -la

      - name: Make build script executable
        run: chmod +x build_dmg.sh

      - name: Build DMG
        run: bash build_dmg.sh "${{ github.event.inputs.version }}"

      - name: List generated files
        run: |
          find . -name "*.dmg" -print
          ls -la
          ls -la dist || true
          ls -la dist/*.dmg 2>/dev/null || true
          find dist -maxdepth 1 -type f 2>/dev/null || true

      - name: Verify app bundle structure
        run: |
          echo "=== Verifying app bundle ==="
          APP="build/RealtimeSubtitle.app"
          
          # Check launcher
          if [ -f "${APP}/Contents/MacOS/realtime-subtitle" ]; then
            echo "  ✅ Launcher exists"
          else
            echo "  ❌ Launcher MISSING — aborting"
            exit 1
          fi
          
          # Check requirements.txt in bundle
          if [ -f "${APP}/Contents/Resources/requirements.txt" ]; then
            echo "  ✅ requirements.txt in bundle"
            echo "  Lines: $(wc -l < ${APP}/Contents/Resources/requirements.txt)"
          else
            echo "  ❌ requirements.txt MISSING from bundle — aborting"
            exit 1
          fi
          
          # Check main.py
          if [ -f "${APP}/Contents/Resources/main.py" ]; then
            echo "  ✅ main.py in bundle"
          else
            echo "  ❌ main.py MISSING from bundle — aborting"
            exit 1
          fi
          
          # Check DMG
          DMG=$(ls dist/*.dmg 2>/dev/null | head -1)
          if [ -n "$DMG" ] && [ -f "$DMG" ]; then
            echo "  ✅ DMG exists: $DMG ($(du -h "$DMG" | cut -f1))"
          else
            echo "  ❌ DMG not found — aborting"
            exit 1
          fi
          
          echo ""
          echo "=== Bundle content (top-level) ==="
          find "${APP}" -maxdepth 3 -not -path '*/.git/*' | sort

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealtimeSubtitle-DMG
          path: dist/*.dmg
          if-no-files-found: error

      - name: Create Release and Upload DMG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Realtime Subtitle v${{ github.event.inputs.version }}
          body: |

            # Realtime Subtitle v${{ github.event.inputs.version }}

            macOS 实时字幕翻译工具 — 基于 Vanyoo/realtime-subtitle 的产品化改造。

            ## 📥 安装

            1. 下载 `RealtimeSubtitle-${{ github.event.inputs.version }}.dmg`
            2. 双击打开 DMG
            3. 拖动 `RealtimeSubtitle.app` 到 `Applications` 文件夹
            4. 首次打开：**右键 → Open**（App 未签名）
            5. App 将自动检测 Python 环境并完成安装（首次启动约 1-2 分钟）

            ## 系统要求

            - macOS 14 (Sonoma) 或更新版本
            - Apple Silicon (M1/M2/M3/M4) 或 Intel Mac
            - Python 3.10+（如未安装，首次启动时会提示下载）

            ## ✨ 核心特性

            | 特性 | 描述 |
            |------|------|
            | 🎤 实时语音识别 | ASR 引擎，支持 whisper / mlx / FunASR |
            | 🌐 异步翻译 | 原文立即显示，翻译延迟 1-3 秒补全 |
            | 🪟 浮窗字幕 | 置顶、半透明、可拖动、可调整样式 |
            | 🔄 多翻译后端 | 在线 API / 本地 LLM / 自定义 API / 关闭翻译 |
            | 📦 模型管理 | 内置下载、删除、切换 ASR 模型 |
            | 🎨 字幕样式 | 字体大小、颜色、透明度、双语模式 |

            ## ⚠️ 注意

            此 App 未进行 Apple 代码签名。首次打开时，请右键点击 App → 选择 **Open**。
          draft: false
          prerelease: false
          files: dist/*.dmg
          fail_on_unmatched_files: true
