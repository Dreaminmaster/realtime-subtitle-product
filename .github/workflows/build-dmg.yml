name: Build and publish macOS DMGs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 2.8.1"
        required: true
        default: "2.8.1"
      publish:
        description: "Publish or update the GitHub release"
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  metadata:
    runs-on: macos-15
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - id: release
        name: Resolve release metadata
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_VERSION="${GITHUB_REF_NAME}"
          else
            RAW_VERSION="${{ inputs.version }}"
          fi
          VERSION="${RAW_VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: ${VERSION}" >&2
            exit 2
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

  quality:
    needs: metadata
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --quiet -r requirements-core.txt pytest
      - name: Static checks
        run: |
          bash -n build_dmg.sh
          .ci-venv/bin/python -m py_compile \
            main.py dashboard.py product_navigation.py launcher.py \
            audio_playback.py session_export.py session_history_player.py \
            session_recording.py ui_components.py mac_translation.py \
            model_catalog.py model_manager.py translation_engine.py
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: .ci-venv/bin/python -m pytest -q

  build:
    needs: [metadata, quality]
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Show build host
        run: |
          sw_vers
          uname -m
      - name: Build and verify DMG
        run: bash build_dmg.sh "${{ needs.metadata.outputs.version }}" "${{ matrix.arch }}"
      - name: Verify target identity
        shell: bash
        run: |
          APP="build/${{ matrix.arch }}/RealtimeSubtitle.app"
          DMG="dist/RealtimeSubtitle-${{ needs.metadata.outputs.version }}-macos-${{ matrix.arch }}.dmg"
          test -d "${APP}"
          test -f "${DMG}"
          test "$(plutil -extract CFBundleIconFile raw "${APP}/Contents/Info.plist")" = "AppIcon"
          grep -q "BUILD_ARCH = \"${{ matrix.arch }}\"" "${APP}/Contents/Resources/version.py"
          file "${APP}/Contents/Resources/python/bin/python3"
          HELPER="${APP}/Contents/Resources/bin/system-audio-capture"
          test -x "${HELPER}"
          file "${HELPER}" | grep -q "${{ matrix.arch }}"
          TRANSLATION_HELPER="${APP}/Contents/Resources/bin/mac-translation"
          test -x "${TRANSLATION_HELPER}"
          file "${TRANSLATION_HELPER}" | grep -q "${{ matrix.arch }}"
          shasum -a 256 "${DMG}"
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealtimeSubtitle-${{ matrix.arch }}
          path: dist/RealtimeSubtitle-${{ needs.metadata.outputs.version }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [metadata, build]
    if: ${{ github.event_name == 'push' || inputs.publish == true }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: RealtimeSubtitle-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release-assets
          shasum -a 256 *.dmg > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          TITLE="Realtime Subtitle ${TAG}"
          cat > release-notes.md <<'EOF'
          Realtime Subtitle 2.8.1 makes session recording, model purpose, and local translation setup explicit.

          - Live now offers three unambiguous choices: Temporary, Save subtitles, and Subtitles + recording. Playback is available only for the third choice.
          - Session transcripts use an adaptive lyrics layout without per-line bubbles; the active line uses a restrained accent and follows recording playback.
          - The appearance preview displays the exact selected number of subtitle rows from 1 to 8.
          - Apple Translation failures now provide in-app language-installation guidance, a System Settings shortcut, and official Apple Help.
          - “Translate into” replaces ambiguous target-language wording.
          - Speech-recognition downloads and translation-service models are clearly separated. LM Studio/API models can be loaded and selected on the Translation page.
          - Tiny/Base recognition now carries an accuracy warning with guidance toward Small or Turbo.
          - Built-in ScreenCaptureKit system audio remains included; no BlackHole driver is required.

          Native macOS downloads are provided separately for Apple Silicon and Intel.

          - `arm64`: Apple M1, M2, M3, M4 and newer Apple Silicon Macs
          - `x86_64`: Intel-based Macs

          This community build is currently unsigned and not notarized. On first launch, Control-click the app and choose Open if macOS blocks it.

          See the bilingual README for setup, permissions and privacy details.
          EOF
          PRERELEASE_ARG=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            PRERELEASE_ARG=(--prerelease)
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TITLE}" --notes-file release-notes.md "${PRERELEASE_ARG[@]}"
            gh release upload "${TAG}" release-assets/* --clobber
          else
            gh release create "${TAG}" release-assets/* --title "${TITLE}" --notes-file release-notes.md "${PRERELEASE_ARG[@]}"
          fi
