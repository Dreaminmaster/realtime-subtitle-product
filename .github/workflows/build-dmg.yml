name: Build and publish macOS DMGs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 2.10.0"
        required: true
        default: "2.10.0"
      publish:
        description: "Publish or update the GitHub release"
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  metadata:
    runs-on: macos-15
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - id: release
        name: Resolve release metadata
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_VERSION="${GITHUB_REF_NAME}"
          else
            RAW_VERSION="${{ inputs.version }}"
          fi
          VERSION="${RAW_VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: ${VERSION}" >&2
            exit 2
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

  quality:
    needs: metadata
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --quiet -r requirements-core.txt pytest
      - name: Static checks
        run: |
          bash -n build_dmg.sh
          .ci-venv/bin/python -m py_compile \
            main.py dashboard.py product_navigation.py launcher.py \
            audio_playback.py session_export.py session_history_player.py \
            session_recording.py ui_components.py mac_translation.py \
            model_catalog.py model_manager.py translation_engine.py \
            translation_model_manager.py \
            recognition_quality.py accuracy_transcriber.py \
            adaptive_vad.py runtime_performance.py \
            src/live_translation_drafts.py src/runtime_metrics.py \
            src/semantic_endpoint.py src/streaming_transcript_state.py \
            transcriber_pool.py src/accuracy_refinement.py \
            src/contextual_phrase_composer.py
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: .ci-venv/bin/python -m pytest -q

  build:
    needs: [metadata, quality]
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Show build host
        run: |
          sw_vers
          uname -m
      - name: Build and verify DMG
        run: bash build_dmg.sh "${{ needs.metadata.outputs.version }}" "${{ matrix.arch }}"
      - name: Verify target identity
        shell: bash
        run: |
          APP="build/${{ matrix.arch }}/RealtimeSubtitle.app"
          DMG="dist/RealtimeSubtitle-${{ needs.metadata.outputs.version }}-macos-${{ matrix.arch }}.dmg"
          test -d "${APP}"
          test -f "${DMG}"
          test "$(plutil -extract CFBundleIconFile raw "${APP}/Contents/Info.plist")" = "AppIcon"
          grep -q "BUILD_ARCH = \"${{ matrix.arch }}\"" "${APP}/Contents/Resources/version.py"
          file "${APP}/Contents/Resources/python/bin/python3"
          HELPER="${APP}/Contents/Resources/bin/system-audio-capture"
          test -x "${HELPER}"
          file "${HELPER}" | grep -q "${{ matrix.arch }}"
          TRANSLATION_HELPER="${APP}/Contents/Resources/bin/mac-translation"
          test -x "${TRANSLATION_HELPER}"
          file "${TRANSLATION_HELPER}" | grep -q "${{ matrix.arch }}"
          shasum -a 256 "${DMG}"
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealtimeSubtitle-${{ matrix.arch }}
          path: dist/RealtimeSubtitle-${{ needs.metadata.outputs.version }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [metadata, build]
    if: ${{ github.event_name == 'push' || inputs.publish == true }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: RealtimeSubtitle-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release-assets
          shasum -a 256 *.dmg > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          TITLE="Realtime Subtitle ${TAG}"
          cat > release-notes.md <<'EOF'
          Realtime Subtitle 2.10.0 upgrades live captions from sentence-at-a-time output to a measured streaming lifecycle.

          - Partial, Stable and Final states update one caption in place; confirmed prefixes stay monotonic and only final segments enter history.
          - LocalAgreement-inspired confirmation and semantic endpointing combine VAD, silence, punctuation, incomplete phrases, language, duration and word limits.
          - Incremental translation sends stable prefixes with provider-aware debounce and source/session revision guards, so late responses cannot overwrite current subtitles.
          - Balanced hardware budgets cap ASR and translation concurrency; Efficient and Maximum remain explicit alternatives.
          - Long bilingual captions and narrow session history reflow without horizontal scrolling or clipping.
          - Playback remains recording-aware and highlights the active line like lyrics; transcript-only sessions do not show misleading playback controls.
          - A privacy-safe benchmark corpus, 30-minute acoustic workload, sourced architecture review and license matrix are included under `docs/` and `benchmarks/`.
          - The full release regression suite contains 693 passing tests.

          Native macOS downloads are provided separately for Apple Silicon and Intel.

          - `arm64`: Apple M1, M2, M3, M4 and newer Apple Silicon Macs
          - `x86_64`: Intel-based Macs

          This community build is currently unsigned and not notarized. On first launch, Control-click the app and choose Open if macOS blocks it.

          See the bilingual README for setup, permissions and privacy details.
          EOF
          PRERELEASE_ARG=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            PRERELEASE_ARG=(--prerelease)
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TITLE}" --notes-file release-notes.md "${PRERELEASE_ARG[@]}"
            gh release upload "${TAG}" release-assets/* --clobber
          else
            gh release create "${TAG}" release-assets/* --title "${TITLE}" --notes-file release-notes.md "${PRERELEASE_ARG[@]}"
          fi
