name: Build and publish desktop installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 2.11.1"
        required: true
        default: "2.11.1"
      publish:
        description: "Publish or update the GitHub release"
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  metadata:
    runs-on: macos-15
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - id: release
        name: Resolve release metadata
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_VERSION="${GITHUB_REF_NAME}"
          else
            RAW_VERSION="${{ inputs.version }}"
          fi
          VERSION="${RAW_VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: ${VERSION}" >&2
            exit 2
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

  quality:
    needs: metadata
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --quiet -r requirements-core.txt pytest
      - name: Static checks
        run: |
          bash -n build_dmg.sh
          .ci-venv/bin/python -m py_compile \
            main.py dashboard.py product_navigation.py launcher.py \
            audio_playback.py session_export.py session_history_player.py \
            session_recording.py ui_components.py mac_translation.py \
            model_catalog.py model_manager.py translation_engine.py \
            translation_model_manager.py \
            recognition_quality.py accuracy_transcriber.py \
            platform_support.py windows_integration.py windows_system_audio.py \
            adaptive_vad.py runtime_performance.py \
            src/live_translation_drafts.py src/runtime_metrics.py \
            src/semantic_endpoint.py src/streaming_transcript_state.py \
            transcriber_pool.py src/accuracy_refinement.py \
            src/contextual_phrase_composer.py
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: .ci-venv/bin/python -m pytest -q

  build:
    needs: [metadata, quality]
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Show build host
        run: |
          sw_vers
          uname -m
      - name: Build and verify DMG
        run: bash build_dmg.sh "${{ needs.metadata.outputs.version }}" "${{ matrix.arch }}"
      - name: Verify target identity
        shell: bash
        run: |
          APP="build/${{ matrix.arch }}/RealtimeSubtitle.app"
          DMG="dist/RealtimeSubtitle-${{ needs.metadata.outputs.version }}-macos-${{ matrix.arch }}.dmg"
          test -d "${APP}"
          test -f "${DMG}"
          test "$(plutil -extract CFBundleIconFile raw "${APP}/Contents/Info.plist")" = "AppIcon"
          grep -q "BUILD_ARCH = \"${{ matrix.arch }}\"" "${APP}/Contents/Resources/version.py"
          file "${APP}/Contents/Resources/python/bin/python3"
          HELPER="${APP}/Contents/Resources/bin/system-audio-capture"
          test -x "${HELPER}"
          file "${HELPER}" | grep -q "${{ matrix.arch }}"
          TRANSLATION_HELPER="${APP}/Contents/Resources/bin/mac-translation"
          test -x "${TRANSLATION_HELPER}"
          file "${TRANSLATION_HELPER}" | grep -q "${{ matrix.arch }}"
          shasum -a 256 "${DMG}"
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealtimeSubtitle-${{ matrix.arch }}
          path: dist/RealtimeSubtitle-${{ needs.metadata.outputs.version }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 30

  build-windows:
    needs: [metadata, quality]
    name: Build Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Windows regression suite
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --disable-pip-version-check --quiet -r requirements-core.txt pytest
          python -m pytest -q
          python main.py --startup-smoke
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build and verify Windows installer
        shell: powershell
        run: .\build_windows.ps1 -Version "${{ needs.metadata.outputs.version }}"
      - name: Verify target identity
        shell: powershell
        run: |
          $Installer = "dist\RealtimeSubtitle-${{ needs.metadata.outputs.version }}-windows-x64-setup.exe"
          if (-not (Test-Path $Installer)) { throw "Missing Windows installer" }
          if ((Get-Item $Installer).Length -lt 100MB) { throw "Windows installer is unexpectedly small" }
          if (-not (Select-String -Path "build\windows-x64\app\version.py" -Pattern 'BUILD_PLATFORM = "windows"' -Quiet)) { throw "Wrong build platform" }
          if (-not (Select-String -Path "build\windows-x64\app\version.py" -Pattern 'BUILD_ARCH = "x86_64"' -Quiet)) { throw "Wrong build architecture" }
          Get-FileHash $Installer -Algorithm SHA256
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealtimeSubtitle-windows-x64
          path: dist/RealtimeSubtitle-${{ needs.metadata.outputs.version }}-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [metadata, build, build-windows]
    if: ${{ github.event_name == 'push' || inputs.publish == true }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: RealtimeSubtitle-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release-assets
          shasum -a 256 *.dmg *.exe > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          TITLE="Realtime Subtitle ${TAG}"
          cat > release-notes.md <<'EOF'
          Realtime Subtitle 2.11.1 hardens the first Windows launch while preserving the streaming caption architecture introduced in 2.10.

          - The Windows launcher now starts the prepared user environment with `pythonw.exe`, monitors the dashboard through first paint, and keeps setup visible if startup fails.
          - Launcher and dashboard processes use independent single-instance locks, eliminating the handoff race that could make a successful first setup disappear after “Ready”.
          - Dashboard stdout/stderr is retained in `app-startup.log`, and startup failures now provide an in-product recovery message instead of closing silently.
          - Native Windows CI now exercises the real Qt dashboard event loop before packaging.

          - Windows system audio uses native WASAPI loopback; VB-CABLE and playback-device rerouting are no longer required.
          - The Windows installer includes portable Python, an offline wheelhouse, Whisper Tiny, and Apache-2.0 English↔Simplified Chinese translation models.
          - Windows translation settings omit Apple-only controls and offer built-in offline translation, LM Studio/local servers, and OpenAI-compatible online APIs.
          - The floating caption window uses native no-activate tool-window behavior so updates stay above other apps without stealing focus or entering Alt-Tab.
          - Windows uses Local AppData, Windows playback-device selection, Segoe UI, and hardware-aware sustained performance budgets.
          - Partial, Stable and Final captions, incremental translation, semantic endpointing, responsive history, lyric-style playback and session export remain shared across platforms.

          Downloads:

          - `arm64`: Apple M1, M2, M3, M4 and newer Apple Silicon Macs
          - `x86_64`: Intel-based Macs
          - `windows-x64-setup.exe`: Windows 10/11 x64 installer

          These community builds are currently unsigned. On macOS, Control-click and choose Open if Gatekeeper blocks the app. On Windows, verify the published SHA-256 checksum before choosing “Run anyway” in SmartScreen.

          See the bilingual README for setup, permissions and privacy details.
          EOF
          PRERELEASE_ARG=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            PRERELEASE_ARG=(--prerelease)
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TITLE}" --notes-file release-notes.md "${PRERELEASE_ARG[@]}"
            gh release upload "${TAG}" release-assets/* --clobber
          else
            gh release create "${TAG}" release-assets/* --title "${TITLE}" --notes-file release-notes.md "${PRERELEASE_ARG[@]}"
          fi
